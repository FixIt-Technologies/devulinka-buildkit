# Devulinka slot classes — the ONE place slot capacity is defined.
#
# Format (pipe-separated, one class per line, # comments ignored):
#   name|slots|priority_slots|pressure_gate
#
#   name           class name passed as `--class` / action input `class`
#   slots          comma-separated slot ids every request competes for
#   priority_slots extra slots only `--priority` requests may take (empty = the
#                  flag is ignored for this class)
#   pressure_gate  1 = normal (non-priority) requests postpone while the host
#                  is under load (BK_LOAD_MAX / BK_MEM_MIN_GB); 0 = exempt
#
# Sizing rule of thumb for the AX162 (96 threads / 128 GB, shared with prod
# eve lanes + sentry): worst case = every slot of every class busy at once —
# keep that inside ~50% of the box.
#
# Changing capacity = edit this file, merge, `git tag -f v1 && git push -f --tags`.
# Consumers pick it up on their next job (the action checkout ships this file).

# heavy image builds: 4 general + 1 reserved for deploy-critical (--priority)
build|g1,g2,g3,g4|p3|1

# cheap CI checks (typecheck, lint, quick bun tests) — never queue behind
# builds, never gated (they aren't the problem)
small|s1,s2,s3,s4||0

# full E2E stacks (compose DB+API+FE + browser) — heavy, gated like builds
e2e|e1,e2,e3,e4,e5,e6,e7,e8||1
