name: bk / test-bun

# Reusable Bun test/build lane for Devulinka self-hosted runners.
#
#   jobs:
#     web-test:
#       uses: FixIt-Technologies/devulinka-buildkit/.github/workflows/test-bun.yml@v1
#       with:
#         runs-on: '["self-hosted","deployik-ci"]'
#         working-directory: web
#         run: |
#           bunx tsc --noEmit
#           bun run test
#           bun run build
#
# On Devulinka runners the Bun download + install cache is a shared named
# volume (runner-bun → /home/runner/.bun) that survives across jobs and
# repos, so installs are warm by default — no actions/cache round-trip.

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels.
        required: true
        type: string
      run:
        description: Commands to run after install.
        required: true
        type: string
      ref:
        type: string
        default: ''
      bun-version:
        description: Pinned Bun version. Keep in sync with the repo's packageManager field.
        type: string
        default: '1.3.9'
      working-directory:
        type: string
        default: '.'
      install:
        description: Run bun install before the commands.
        type: boolean
        default: true
      frozen-lockfile:
        type: boolean
        default: true
      clean:
        description: >-
          Pass false to keep untracked build caches (node_modules, .next/cache,
          *.tsbuildinfo) on the persistent runner workdir; a scoped git clean
          still removes every other untracked file. Default true = the old
          full `git clean -ffdx` behavior. Ignored (forced clean) on
          pull_request events: a PR job must never inherit — or seed — caches
          on the persistent workdir a trusted branch/tag job later reuses.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 30

jobs:
  test:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          clean: ${{ inputs.clean || github.event_name == 'pull_request' }}

      - name: Clean untracked files (keep dependency caches)
        if: ${{ !inputs.clean && github.event_name != 'pull_request' }}
        run: git clean -ffdx -e node_modules -e '**/.next/cache' -e '*.tsbuildinfo'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}

      # PR jobs must not write the shared warm Bun cache (a runner volume that
      # survives across jobs and repos): give them a job-local cache dir
      # instead. Runner-level mount isolation is the real boundary for hostile
      # code; this keeps ordinary PR runs from ever touching the shared path.
      - name: Scope Bun cache for PR isolation
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BUN_INSTALL_CACHE_DIR=$RUNNER_TEMP/bun-cache-pr" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: ${{ inputs.install }}
        working-directory: ${{ inputs.working-directory }}
        run: bun install ${{ inputs.frozen-lockfile && '--frozen-lockfile' || '' }}

      - name: Run
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.run }}

      # PR isolation, second half: the pre-job clean stops a PR job from
      # INHERITING caches; this stops it from SEEDING them. Whatever the PR
      # run wrote (node_modules, build caches) is removed even on failure, so
      # a later branch/tag job with clean:false can only ever consume caches
      # produced by trusted refs.
      # No `|| true`: a failed clean means the PR left state a trusted job
      # would inherit — that must be loud, not swallowed.
      - name: Post-job clean (PR isolation)
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          git clean -ffdx
          rm -rf "$RUNNER_TEMP/bun-cache-pr"
