name: deploy (buildkit v2)

# Reusable deploy lane — the paved path of buildkit v2.
#
# The consumer job never touches SSH: every step goes through deployctl to
# the deploy-gateway on the Devulinka host, which authenticates this runner
# by its bastion-guest lease, enforces repo→target policy host-side, and
# runs the verb against the target's forced-command dispatcher with a key
# that never existed in GitHub.
#
# Consuming (FixIt deploy-dev example):
#
#   deploy:
#     uses: FixIt-Technologies/devulinka-buildkit/.github/workflows/deploy.yml@v2
#     secrets: inherit          # prepare renders env payloads from these
#     with:
#       runs-on: '["self-hosted","fixit-bastion"]'
#       target: fixit-dev
#       prepare: |
#         bash scripts/deploy/render-env.sh dev-api > /tmp/payloads/env.development
#       plan: |
#         env-put development @/tmp/payloads/env.development
#         pull 111
#         migrate
#         roll-api
#
# Plan grammar: one step per line — `verb [args...] [@payload-file]`.
# Blank lines and #-comments are skipped. A failing step aborts the plan.

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON array of runner labels — must target your repo's bastion scale set
        required: true
        type: string
      target:
        description: Logical deploy target, <project>-<env>
        required: true
        type: string
      plan:
        description: Deploy steps, one `verb [args...] [@payload-file]` per line
        required: true
        type: string
      prepare:
        description: Bash run before the plan (render payload files; secrets/vars available as SECRETS_JSON / VARS_JSON)
        required: false
        type: string
        default: ''
      checkout-ref:
        description: Ref to check out for prepare scripts (default = triggering ref)
        required: false
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout
        required: false
        type: number
        default: 30

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref }}

      - name: Check out buildkit
        uses: actions/checkout@v5
        with:
          repository: FixIt-Technologies/devulinka-buildkit
          ref: v2
          path: .buildkit-v2

      - name: Verify gateway identity
        run: |
          set -euo pipefail
          curl -fsS --max-time 10 "${DEPLOY_GATEWAY_URL:-http://192.168.251.1:8791}/v1/whoami"

      - name: Prepare payloads
        if: inputs.prepare != ''
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p /tmp/payloads
          bash -euo pipefail -c '${{ inputs.prepare }}'

      - name: Run deploy plan
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            [[ -z $line || $line == \#* ]] && continue
            echo "::group::deploy ${{ inputs.target }} · $line"
            # shellcheck disable=SC2086 — plan tokens are validated by deployctl
            bash .buildkit-v2/scripts/deployctl.sh '${{ inputs.target }}' $line
            echo "::endgroup::"
          done <<'PLAN_EOF'
          ${{ inputs.plan }}
          PLAN_EOF

      - name: Scrub payloads
        if: always()
        run: rm -rf /tmp/payloads
